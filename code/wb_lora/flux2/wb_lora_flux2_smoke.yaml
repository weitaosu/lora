---
# SMOKE TEST v2: validate v2 recipe (filtered dataset, rank 64, res 768) before the 2.5h full run.
# 5 train steps, no sampling. Confirms: dataset loads 77 imgs, captions read, no OOM at rank 64 + 768.
job: extension
config:
  name: "wb_lora_flux2_smoke_v3"
  process:
    - type: "sd_trainer"
      training_folder: "C:/Users/weita/Desktop/deep_learning/final_proj/models/wb_lora_flux2"
      device: "cuda:0"
      trigger_word: "wbronkhorst style"

      network:
        type: "lora"
        linear: 32                           # v3: match production yaml (rank 32, less aggressive than v2's rank 64)
        linear_alpha: 32

      save:
        dtype: "float16"
        save_every: 100
        max_step_saves_to_keep: 1
        push_to_hub: false

      datasets:
        - folder_path: "C:/Users/weita/Desktop/deep_learning/final_proj/data/wb_lora_train_filtered"  # v2 filtered set (77 imgs)
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true        # cache VAE latents to disk (drop VAE from VRAM after first epoch)
          cache_text_embeddings: true        # cache Qwen3 outputs + unload Qwen3 (~8 GB VRAM freed)
          buckets: false                     # SINGLE bucket -> no per-aspect CUDA recompile
          resolution: 768                    # match v2 (was 512 in old smoke)

      train:
        batch_size: 1
        steps: 5                             # SMOKE TEST — just verify pipeline works
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        ema_config:
          use_ema: false
        dtype: "bf16"
        disable_sampling: true               # skip sampling during smoke test

      model:
        arch: "flux2_klein_9b"
        name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
        flux2_klein_te_path: "Qwen/Qwen3-8B"
        quantize: true
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false                      # CPU offload was 100× too slow on 8B Qwen3 quantize
        layer_offloading: false

meta:
  name: "[name]"
  version: '1.0'
